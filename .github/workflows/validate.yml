name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test action helpers
        run: python3 -m unittest discover -s scripts/pr-bot -p 'test_*.py' -v
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: false
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Docker end-to-end test
        run: scripts/pr-bot/test-action-docker.sh
        env:
          INDEXERS: go typescript python dotnet clang java dart php ruby rust
          GITHUB_TOKEN: ${{ github.token }}
