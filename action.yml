name: tld PR diagram
description: Generate and cache PR impact diagrams, then publish them from a trusted workflow.
branding:
  icon: layers
  color: blue
inputs:
  mode:
    description: generate or publish
    default: generate
  tld-version:
    description: tld release tag to download, or latest to use the newest stable release
    default: latest
  repository-path:
    description: Path to the checkout to index
    default: ${{ github.workspace }}
  prepare-command:
    description: Bash setup command executed inside each uncached revision
    default: ''
  indexers:
    description: SCIP indexers to install. auto installs every supported indexer, or give a space/comma list (go, typescript, python, dotnet, clang, java, dart, php, ruby, rust)
    default: auto
  artifact-name:
    description: Result artifact name shared by generation and publication
    default: tld-pr-diagram
  run-id:
    description: Originating workflow run (defaults to the workflow_run event)
    default: ''
  source-workflow:
    description: Expected generator workflow filename, verified before publication
    default: pr-diagram.yml
  github-token:
    description: Token used to resolve the latest tld release and by publish mode; requires contents read plus actions read and pull-requests write to publish
    default: ${{ github.token }}
outputs:
  status:
    description: ready, skipped, empty, or error
    value: ${{ steps.generate.outputs.status || steps.init.outputs.status }}
runs:
  using: composite
  steps:
    - name: Initialize diagram result and cache keys
      id: init
      if: inputs.mode == 'generate'
      shell: bash
      env:
        TLD_ACTION_PATH: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TLD_VERSION: ${{ inputs.tld-version }}
        INPUT_REPOSITORY_PATH: ${{ inputs.repository-path }}
        INPUT_PREPARE_COMMAND: ${{ inputs.prepare-command }}
        INPUT_INDEXERS: ${{ inputs.indexers }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
      run: python3 "$TLD_ACTION_PATH/scripts/pr-bot/main.py" init

    - name: Set up Go
      id: setup-go
      if: steps.init.outputs.status != 'error' && inputs.mode == 'generate'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.2'
        cache: false

    - name: Set up Node
      id: setup-node
      if: steps.init.outputs.status != 'error' && inputs.mode == 'generate'
      continue-on-error: true
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Set up Dart
      id: setup-dart
      if: steps.init.outputs.status != 'error' && inputs.mode == 'generate' && contains(steps.init.outputs.indexers, 'dart')
      continue-on-error: true
      uses: dart-lang/setup-dart@v1

    - name: Restore tld binary and indexers
      id: binary-cache
      if: steps.init.outputs.binary-key != '' && steps.init.outputs.status != 'error'
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.init.outputs.binary-dir }}
        key: ${{ steps.init.outputs.binary-key }}

    - name: Download tld and install SCIP indexers
      id: tools
      if: steps.init.outputs.binary-key != '' && steps.init.outputs.status != 'error'
      continue-on-error: true
      shell: bash
      env:
        TLD_ACTION_PATH: ${{ github.action_path }}
        TLD_BINARY_DIR: ${{ steps.init.outputs.binary-dir }}
        TLD_VERSION: ${{ steps.init.outputs.tld-version }}
        INDEXERS: ${{ steps.init.outputs.indexers }}
        GOWORK: 'off'
        CGO_ENABLED: '0'
        PUB_CACHE: ${{ steps.init.outputs.binary-dir }}/scip-pub
        COMPOSER_HOME: ${{ steps.init.outputs.binary-dir }}/scip-php
      run: |
        if [[ "$RUNNER_OS" != Linux ]]; then
          echo 'The tld PR action requires an Ubuntu runner.'
          exit 1
        fi
        # shellcheck disable=SC1091
        source /etc/os-release
        if [[ "$ID" != ubuntu ]]; then
          echo 'The tld PR action requires an Ubuntu runner.'
          exit 1
        fi
        if [[ ! -x "$TLD_BINARY_DIR/tld" ]]; then
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=tld_Linux_x86_64.tar.gz ;;
            Linux-ARM64) asset=tld_Linux_arm64.tar.gz ;;
            *) echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          download_dir=$(mktemp -d)
          trap 'rm -rf "$download_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/Mertcikla/tld/releases/download/$TLD_VERSION/$asset" \
            --output "$download_dir/archive.tar.gz"
          tar -xzf "$download_dir/archive.tar.gz" -C "$download_dir" tld
          chmod +x "$download_dir/tld"
          mv "$download_dir/tld" "$TLD_BINARY_DIR/tld"
        fi
        "$TLD_BINARY_DIR/tld" --version

        # Indexers install into the cached binary dir. A failed install is a
        # warning, not an error: tld reports any tool a project needs but
        # cannot find, and the diagram is omitted only for that project.
        npm_prefix="$TLD_BINARY_DIR/scip-npm"
        dotnet_dir="$TLD_BINARY_DIR/scip-dotnet"
        coursier_dir="$TLD_BINARY_DIR/scip-coursier"
        pub_bin="$PUB_CACHE/bin"
        php_bin="$COMPOSER_HOME/vendor/bin"
        rust_bin="$HOME/.cargo/bin"
        export PATH="$TLD_BINARY_DIR:$npm_prefix/bin:$dotnet_dir:$coursier_dir:$pub_bin:$php_bin:$rust_bin:$PATH"

        install_indexer() {
          case "$1" in
            go)
              if [[ ! -x "$TLD_BINARY_DIR/scip-go" ]]; then
                GOBIN="$TLD_BINARY_DIR" go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.7
              fi
              ;;
            typescript)
              if [[ ! -x "$npm_prefix/bin/scip-typescript" ]]; then
                npm install --global --prefix "$npm_prefix" @sourcegraph/scip-typescript@0.4.0
              fi
              ;;
            python)
              if [[ ! -x "$npm_prefix/bin/scip-python" ]]; then
                npm install --global --prefix "$npm_prefix" @sourcegraph/scip-python
              fi
              ;;
            dotnet)
              if [[ ! -x "$dotnet_dir/scip-dotnet" ]]; then
                dotnet tool install --tool-path "$dotnet_dir" scip-dotnet
              fi
              ;;
            clang)
              if [[ ! -x "$TLD_BINARY_DIR/scip-clang" ]]; then
                case "$RUNNER_ARCH" in
                  X64) asset=scip-clang-x86_64-linux ;;
                  ARM64) asset=scip-clang-arm64-linux ;;
                  *) echo "Unsupported arch for scip-clang: $RUNNER_ARCH"; return 1 ;;
                esac
                curl --fail --silent --show-error --location --retry 3 \
                  "https://github.com/sourcegraph/scip-clang/releases/download/v0.4.0/$asset" \
                  --output "$TLD_BINARY_DIR/scip-clang"
                chmod +x "$TLD_BINARY_DIR/scip-clang"
              fi
              ;;
            java)
              if [[ ! -x "$coursier_dir/scip-java" ]]; then
                mkdir -p "$coursier_dir"
                if [[ ! -x "$TLD_BINARY_DIR/cs" ]]; then
                  curl --fail --silent --show-error --location --retry 3 \
                    https://github.com/coursier/launchers/raw/master/coursier \
                    --output "$TLD_BINARY_DIR/cs"
                  chmod +x "$TLD_BINARY_DIR/cs"
                fi
                COURSIER_BIN_DIR="$coursier_dir" "$TLD_BINARY_DIR/cs" install scip-java \
                  || COURSIER_BIN_DIR="$coursier_dir" "$TLD_BINARY_DIR/cs" install --contrib scip-java
              fi
              ;;
            dart)
              if [[ ! -x "$pub_bin/scip-dart" && ! -x "$pub_bin/scip_dart" ]]; then
                dart pub global activate scip_dart
              fi
              ;;
            php)
              if [[ ! -x "$php_bin/scip-php" ]]; then
                composer global require --no-interaction davidrjenni/scip-php
              fi
              ;;
            ruby)
              if [[ ! -x "$TLD_BINARY_DIR/scip-ruby" ]]; then
                if [[ "$RUNNER_ARCH" == X64 ]]; then
                  curl --fail --silent --show-error --location --retry 3 \
                    "https://github.com/sourcegraph/scip-ruby/releases/latest/download/scip-ruby-x86_64-linux" \
                    --output "$TLD_BINARY_DIR/scip-ruby"
                  chmod +x "$TLD_BINARY_DIR/scip-ruby"
                else
                  gem install scip-ruby
                fi
              fi
              ;;
            rust)
              if ! command -v rust-analyzer >/dev/null; then
                rustup component add rust-analyzer
              fi
              ;;
            *)
              echo "Unknown indexer: $1"
              return 1
              ;;
          esac
        }

        for indexer in $INDEXERS; do
          if install_indexer "$indexer"; then
            echo "Installed SCIP indexer: $indexer"
          else
            echo "::warning::Failed to install SCIP indexer: $indexer"
          fi
        done

        for dir in "$TLD_BINARY_DIR" "$npm_prefix/bin" "$dotnet_dir" "$coursier_dir" "$pub_bin" "$php_bin" "$rust_bin"; do
          echo "$dir" >> "$GITHUB_PATH"
        done

    - name: Save tld binary and indexers
      if: steps.tools.outcome == 'success' && steps.setup-go.outcome == 'success' && steps.setup-node.outcome == 'success' && steps.binary-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.init.outputs.binary-dir }}
        key: ${{ steps.init.outputs.binary-key }}

    - name: Restore indexed snapshots
      if: steps.init.outputs.cache-key != '' && steps.init.outputs.status != 'error'
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.init.outputs.data-dir }}
        key: ${{ steps.init.outputs.cache-key }}
        restore-keys: ${{ steps.init.outputs.restore-keys }}

    - name: Generate diagram
      id: generate
      if: ${{ !cancelled() && steps.init.outputs.status != 'error' && inputs.mode == 'generate' }}
      shell: bash
      env:
        TLD_ACTION_PATH: ${{ github.action_path }}
        INPUT_REPOSITORY_PATH: ${{ inputs.repository-path }}
        INPUT_PREPARE_COMMAND: ${{ inputs.prepare-command }}
        INPUT_INDEXERS: ${{ inputs.indexers }}
        INPUT_TOOLS_READY: ${{ steps.tools.outcome == 'success' && steps.setup-go.outcome == 'success' && steps.setup-node.outcome == 'success' }}
      run: python3 "$TLD_ACTION_PATH/scripts/pr-bot/main.py" generate

    - name: Save indexed snapshots
      if: ${{ !cancelled() && steps.generate.outputs.cache-ready == 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.init.outputs.data-dir }}
        key: ${{ steps.init.outputs.cache-key }}

    - name: Upload PR diagram result
      if: ${{ !cancelled() && inputs.mode == 'generate' }}
      continue-on-error: true
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/tld-pr-bot/result/result.json
        retention-days: 3
        if-no-files-found: warn

    - name: Validate originating run and PR
      id: publication
      if: inputs.mode == 'publish'
      shell: bash
      env:
        TLD_ACTION_PATH: ${{ github.action_path }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python3 "$TLD_ACTION_PATH/scripts/pr-bot/main.py" publish-check

    - name: Download result from the validated run
      if: steps.publication.outputs.publish == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/tld-pr-bot/download
        run-id: ${{ steps.publication.outputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Update PR comment
      if: ${{ !cancelled() && steps.publication.outputs.publish == 'true' }}
      shell: bash
      env:
        TLD_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python3 "$TLD_ACTION_PATH/scripts/pr-bot/main.py" publish
